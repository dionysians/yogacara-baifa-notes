  last_session_content: "悭单法精修（随烦恼第六法 6/20，小随首入贪系·缘自所有，单法学习循环五段，60min）。悭 = 贪一分'秘吝'分位（耽著法财/不能惠施/秘吝为性/能障不悭/鄙畜为业），E 分位假立、无内部诤议；五悭细目（《大毗婆沙论》：住处悭/家悭/施悭/称誉悭/法悭）。【主线1 体性机制】**三段链无反转**（耽著→秘吝→鄙畜——根在贪相也在贪，贪系最'诚实'的随烦恼·无嫉那样的反转点，苦质地=收紧非热恼）+**悭嫉镜像**（守内/憎外——同一「我所」边界守卫两面：嫉憎外'他有=我损'守相对高度/悭守内'给出=我损'守绝对存量，接假说12外向扩张我所）+**财悭法悭不对称**（财零和/法非零和→法悭守的是位置稀缺性=借嫉的排名脚手架，法悭是悭嫉交界）。【施的边界框架·本法主产出】修行者真问题'施需缘法、不能无差别施'→经典完整作答：①时机**响应式非搜索式**（《瑜伽师地论》施品'见来求者'；缘不现前不施=无境非悭；主动遍寻施处=菩萨圆满层非凡夫义务——把响应式结构误框成搜索问题是分辨不清的根源之一）；②**遮缘三条**（修行者对经典明文的无损压缩：真实伤害被施者/施对象不由己支配·眷属不强施/真实伤害自己·称力线〔随力随分·应时施《优婆塞戒经》〕）；③**'触发烦恼不算自伤'精度**（那正是要磨的悭；真遮缘事后心安/悭借壳事后理由反复自我重申〔第三层〕）；④**判心相不判施否**（施境下心紧=悭；先认紧后简择防悭收编简择；回避施境=悭的隐蔽形态〔第三层〕）——与持戒究竟层'判心所配置不判形式'严格同构；三福田=地理非时机判定器。【见自】**'悭≠我所执'归位**（拒绝范围膨胀新形态——修行者不只拒立自己的膨胀假说、也拒绝模型的膨胀提问：'「我的」边界感如何运作'之问越界涉我所执全域七项清单；经五悭细目+'施界面'判准〔可分享而紧缩不肯〕归位：财物/关系/名誉/法四项属悭、所坚持内容→见取+法贪/喜好→贪爱/我本身→萨迦耶见三项各归己通道，复杂性属末那不属悭）+**四界面严格不现行**（'4个都是严格的没有'——每遇施境天然跑遮缘单：施物与对象是否合适/引介关系对双方是否都好='对双方都好'简择=愧共业秩序质地、'如果大家都这样做'究竟层世俗化操作系统占住施界面，悭无现行位置；事后心安清安常态；本次只做名相归位非安装新配置，结构归位与现量现行分离·不现行≠永断·归档无主修区）。【见众生】凡夫悭=**保全概率最高的常驻动机结构必然**（动力=贪已得+失则损=施则存量减+保全概率≈接近必然——守住几乎必然立即奏效、奖励从不落空，高于覆的'间歇保全'=常驻动机候选第二复证·最强样本）+**五家所共**点破'保全'为延迟结算（王贼火水恶子——存量本守不住，被所有物反向占有·物成主人成守卫）+出口='「我的」无自性'——**嫉/悭/慢/憍同收'破我所·实我中心'一把钥匙**（嫉拆排名/悭拆所有权，假说18一致）。**双重假候选第三复证**（体上分位假立·贪一分✓+所缘上世俗概念假立——「我的」所有权=共业约定产物·法律/习俗/默契、物上不带'我的'标签✓；精度：脚手架可拆、其下接末那俱生我所执·比比较心更顽固）。笔记产出：悭.md重写（替换2026-03-05模板初稿，九节：经典地基含五悭/辨异嫉贪无贪/主线1三小节/施的边界四小节含完整判法/见自归位+四界面/见众生/结构关联/学术诚实含'拒绝范围膨胀'归位记录box/关联）/概念卡新建4张（《大毗婆沙论》/《优婆塞戒经》/五家所共/三福田）/CLAUDE.md当前阶段未处理内容双重假候选加悭第三复证+常驻动机候选加悭最强复证（均改待诳/谄/害/憍续证）+活跃议题⑤悭bullet（教学动作：报告'不想给/舍不得'→先分诊遮缘三条尤其称力线+问心开心紧不判施否；理由反复自我重申→悭借壳；无主修区归档不花带宽）/修行者画像§8.15新建+§九演化表悭行+footer。｜以下为前次（2026-06-12 嫉 60min·本日覆/恼/嫉三法同日200min）：嫉单法精修（随烦恼第五法 5/20，首个离嗔系违境链·起于他荣境，单法学习循环五段，60min；本日覆/恼/嫉三法合并日志·同日200min）。嫉 = 瞋一分'不耐他荣'分位（殉自名利/不耐他荣/妒忌为性/能障不嫉/忧戚为业），E 分位假立、无内部诤议。【主线1 体性机制】三段链（殉自名利根·贪→不耐他荣反转点→妒忌忧戚相·瞋）+ 反转点'顺境被我执读成逆境'（他荣本顺境，殉自名利这把尺量成我损）；**根在贪相在瞋=「嗔←我爱←我痴」通则的显式书写**（修行者主导：所有嗔来源于贪/我爱，末那俱生四惑我痴我见我慢我爱，嗔依违我所爱起·无所爱则无所嗔；殉自名利就是嫉体性定义的前提部分、不需另找身份）；**嫉为何挑明贪根**（忿恨恼的违是境直接违我所爱·贪根藏背后，嫉的违是顺境被我执二次加工·不点破殉自名利就解释不了他荣凭什么成逆境→贪根必须挑明接住反转）。【主线2 见自见众+对治】见自二分（非零和场贪内容本身→转研究姿态 / 真实零和场贪排名→忧戚明显）→**修行者自主究竟拆掉零和**（二分本身默认排名实有，但排名是比较心产物·想比则有不想比则无·无天然带排名的境→零和场也能拆纯境；精度护栏：所空是'我相对他的价值序'·不否认物理结果）；**对治双入口分离**（贪求不得回贪根·另一回事可留贪作世俗动力 / 嫉拆'我他对立'动作·命门后者不必动贪根·随喜反向磨贪）；**究竟收于我痴**（连排名都不实→嫉究竟根=我痴·立实我中心造比较默认别人有=我损；对治究竟=了无自性锚照破排名不实→嫉自动消·收进无痴双线不需独立通道；慢/憍/嫉同一把钥匙破实我中心·假说18一致·三朝向我胜他/自盛/他胜我）；**随喜质地'冷→平'校正**（模型曾推随喜冷质地缺为他高兴情感=表层标签转移·信德冷质地〔限三宝〕泛化到对人随喜，经现量否决：实为情感基线低波动但为他＝为己等量·无狂热极端·本具足·不需培养热情反成装相）。见众生：凡夫嫉=看不破排名无自性的结构性必然·非品行问题=利他善巧轴第三层最深一填。**本法含一处'现量证伪假说→收于我痴'自我校正**（模型提假说18在真实零和场无处可转·嫉必回贪根，被修行者现量〔排名不实〕证伪）+一处模型'表层标签转移'自查（冷→平）。笔记产出：嫉.md重写（替换2026-03-05模板初稿，八节·两主线+两层校正）/ 无嗔.md §8.4回填（喜对治嫉校准·究竟收我痴·随喜质地冷→平）+§十四待办+§14.2标注表清'待嫉学完'标记 / 回填清单'无嗔§八喜对治嫉'迁archive / 修行者画像§8.14+§九演化表嫉行+footer / CLAUDE.md活跃议题⑤嫉bullet+双重假候选加嫉复证支持 / 概念卡新建我痴·我爱（末那四惑）+嫉卡补究竟根我痴段+复用成唯识论/窥基/五果。｜以下为前次（2026-06-12 恼 90min·同日）：恼单法精修（随烦恼第四法 4/20，回到嗔系·一股瞋三换相位第三相暴发点，单法学习循环五段，90min）。恼 = 瞋一分'追触暴热狠戾'分位（忿恨为先/追触暴热/狠戾为性/能障不恼/蛆螫为业），E 分位假立、无内部体性诤议（回到嗔系纯瞋平地）。【主线1 体性机制】**恼≠强忿（双刃·本法要害）**——唯识按行相非强度分立（贪强弱皆贪/慢七慢靠行相）：强忿仍是忿（强度非判据）/ 恼非强忿（需恨结怨之往恶+狠戾+蛆螫·行相级另立）；**双爪结构**（现前爪=触现违缘〔与忿共用〕+ 往恶爪=追往恶）；**往恶爪严格=恨结怨之追忆**（经典'追往恶、触现违缘，心便狠戾，蛆螫他'锁成一条机制=追怨生毒）——瞋种厚度/类化看不惯属**忿的强度源、非恼库存**（订正一处膨胀）；**狠戾来自恨怨发酵**（怀恶不舍·热恼即发酵，越久越毒=恼比忿多一层戾的来源）；**双爪对治**（断现前+清恨怨，戾毒为果·断两源即熄·不需第三味药）。【主线2 见自见众】见自：**恼结构性不现行**（恼需忿恨为先+追往恶，修行者恨不现行〔归因改道无结怨〕→无往恶可追→经典上够不成恼；嗔系链三相=忿现行/恨不现行/恼不现行）；**亲子训斥经现量校正 恼→强忿**（精修中途曾误判恼+以类化/俱生顶替缺位的恨，经严格回经典两点校回：①愤发·明确无刺伤毒=无狠戾不成恼〔狠戾是恼的体〕②会翻旧账但无恨累积·'只是感到严重性'=评估严重非结怨，'追往评估'≠恼的'追往恶追怨生毒'）；**强忿强度源=见解嗔'覆该禁'我所强加〔触发点2〕根深蒂固+屡犯严重性评估**（皆非恨；覆案最初'见解嗔'判对了）；**惭愧为何不亮+'没认识到=分别'判定锁**（见解嗔伪装成客观标准→惭愧不触发=没认识到非来不及；闻思一拆即松〔覆案看通三段皆缺后已能不发脾气〕⟹出身分别·见道断分别修道断俱生；对治=闻思揭伪装减强度源+实修截现前忿耦合）。见众：凡夫真有恼（恨现行有怨发酵）；**嗔系链见众生封顶 恼←恨←贪**（链根没放下的贪/'他坏'看链末毒·'他苦'看链根爱执=苦因非坏人）+ **越陷越深苦·利他善巧轴第三层最彻底一填**（戾=陈怨发酵到极毒·越刻毒者贪执抱越死陷越深·连'最像坏人'都还原成'陷最深的苦'·评判线彻底拆完，与恨§4.3'觉得人坏=恨恼产物'两头对上）。**本法含一处'经典>假说+拒立膨胀'现量自我校正样本**（修行者主导：误判恼→严格回经典〔搜忿恨恼三定义〕→校回强忿）。笔记产出：恼.md 重写（替换2026-03-05模板初稿，八节·校正版含§7自我校正记录）/ 生活修对治案003回填校正（训斥忿→恼→强忿，§一